url: https://wbvguo.github.io/Rtoolset/

template:
  bootstrap: 5
  includes:
    in_header: |
      <style>
        /* Ensure TOC is visible on articles */
        .contents h2, .contents h3 {
          scroll-margin-top: 70px;
        }
      </style>
  params:
    bootswatch: default

navbar:
  structure:
    left: [logo, intro, reference, articles]
    right: [github]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/wbvguo/Rtoolset
      aria-label: GitHub repository
  logo:
    image: man/figures/logo/Rtoolset.svg
    href: index.html
    alt: Rtoolset logo

home:
  title: Rtoolset
  readme: false
  index: index.md
  sidebar:
    # structure: [links, license, community, citation, authors]
    structure: [links, license, community]
    components:
      license:
        title: License
        text: "[MIT License](LICENSE.html)"
      # citation:
      #   title: Citation
      #   text: |
      #     If you use Rtoolset in your research, please cite:
      #     ```
      #     @Manual{rtoolset,
      #       title = {Rtoolset: A Tool Set for R Programming and Data Analysis},
      #       author = {Wenbin Guo},
      #       year = {2025},
      #       note = {R package version 0.1.0}
      #     }
      #     ```

reference:
  - title: Sample Operations
    desc: >
      Functions that operate on samples/observations.
      See the [Sample partition](articles/sample-partition.html) vignette.
    contents:
      - balanced_partition
      - balance_partition_core
  
  - title: Feature Operations
    desc: >
      Functions that operate on features/genes/variables.
      See the [RNA-seq Workflow](articles/rnaseq-workflow.html) vignette.
    contents:
      - get_top_var_mat
      - filter_calcpm_dge
  
  - title: Data Transformation
    desc: >
      Functions that transform entire matrices/dataframes.
      See the [RNA-seq](articles/rnaseq-workflow.html) and [DNA Methylation](articles/dnam-workflow.html) vignettes.
    contents:
      - log_transform
      - beta2M
  
  - title: Utilities
    desc: >
      Helper functions for common tasks.
      See the [Utilities Guide](articles/utilities-guide.html) vignette.
    contents:
      - closestMatch
      - print_pval
      - vec2print
      - mkdir
      - save2pdf
      - extract_params
      - createNamedList
      - install_packages
      - check_packages
  
  - title: Visualization & Fun
    desc: >
      Games and visualizations.
      See the [Visualization](articles/visualization.html) vignette.
    contents:
      - play_2048
      - draw_heart
      - draw_heart_step
      - draw_heart_gif
      - draw_xmas_tree_gif
      - draw_xmas_tree_gif_panel

articles:
  - title: "Data Visualization"
    navbar: ~
    contents:
      - visualization
  
  - title: "Data Analysis"
    navbar: ~
    contents:
      - sample-partition
  
  - title: "Genomics Workflows"
    navbar: ~
    contents:
      - rnaseq-workflow
      - dnam-workflow
  
  - title: "Utilities"
    navbar: ~
    contents:
      - utilities-guide

