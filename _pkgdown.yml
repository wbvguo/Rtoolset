url: https://wbvguo.github.io/Rtoolset/

template:
  bootstrap: 5
  includes:
    in_header: |
      <style>
        /* Ensure TOC is visible on articles */
        .contents h2, .contents h3 {
          scroll-margin-top: 70px;
        }
      </style>
  params:
    bootswatch: default

navbar:
  structure:
    left: [logo, intro, reference, tutorials]
    right: [github]
  components:
    tutorials:
      text: Tutorials
      menu:
        - text: Data Visualization
        - text: Visualization
          href: articles/visualization.html
        - text: -------
        - text: Data Operations
        - text: Sample Partition
          href: articles/sample-partition.html
        - text: -------
        - text: Omics Analysis
        - text: RNA-seq
          href: articles/omics-rnaseq.html
        - text: DNA Methylation
          href: articles/omics-methylation.html
        - text: -------
        - text: Utilities
        - text: Utility Functions Guide
          href: articles/utilities-guide.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/wbvguo/Rtoolset
      aria-label: GitHub repository
  logo:
    image: man/figures/logo/Rtoolset.svg
    href: index.html
    alt: Rtoolset logo

home:
  title: Rtoolset
  readme: false
  index: index.md
  sidebar:
    html: pkgdown/home-sidebar.html

reference:
  - title: Sample Operations
    desc: >
      Functions that operate on samples/observations.
      See the [Sample partition](articles/sample-partition.html) vignette.
    contents:
      - balanced_partition
      - balance_partition_core
  
  - title: Feature Operations
    desc: >
      Functions that operate on features/genes/variables.
      See the [Omics Overview](articles/omics-overview.html) vignette.
    contents:
      - get_top_var_mat
      - filter_calcpm_dge
  
  - title: Data Transformation
    desc: >
      Functions that transform entire matrices/dataframes.
      See the [Omics Overview](articles/omics-overview.html) vignette.
    contents:
      - log_transform
      - beta2M
  
  - title: Utilities
    desc: >
      Helper functions for common tasks.
      See the [Utilities Guide](articles/utilities-guide.html) vignette.
    contents:
      - closestMatch
      - print_pval
      - vec2print
      - mkdir
      - save2pdf
      - extract_params
      - createNamedList
      - install_packages
      - check_packages
  
  - title: Visualization & Fun
    desc: >
      Games and visualizations.
      See the [Visualization](articles/visualization.html) vignette.
    contents:
      - play_2048
      - draw_heart
      - draw_heart_step
      - draw_heart_gif
      - draw_xmas_tree_gif
      - draw_xmas_tree_gif_panel

articles:
  - title: "Data Visualization"
    navbar: ~
    contents:
      - visualization
  
  - title: "Data Analysis"
    navbar: ~
    contents:
      - sample-partition
  
  - title: "Omics"
    navbar: ~
    contents:
      - omics-overview
      - omics-rnaseq
      - omics-methylation
  
  - title: "Utilities"
    navbar: ~
    contents:
      - utilities-guide
